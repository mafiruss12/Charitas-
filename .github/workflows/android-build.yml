name: Android CI Build APK AAB and Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
      - "public/app-version.json"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools and SDK 35
        run: |
          set -eux
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          if [ -d cmdline-tools/bin ]; then
            mv cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          else
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Write local.properties
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode release keystore if configured
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/charitas-release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/charitas-release.jks" >> "$GITHUB_ENV"
            echo "CI_ALLOW_DEBUG_SIGNING_FOR_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "CI_ALLOW_DEBUG_SIGNING_FOR_RELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        working-directory: android
        env:
          CHARITAS_API_BASE_URL: ${{ vars.CHARITAS_API_BASE_URL }}
          CHARITAS_DEBUG_API_BASE_URL: ${{ vars.CHARITAS_DEBUG_API_BASE_URL }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble release & debug APKs
        working-directory: android
        env:
          CHARITAS_API_BASE_URL: ${{ vars.CHARITAS_API_BASE_URL }}
          CHARITAS_DEBUG_API_BASE_URL: ${{ vars.CHARITAS_DEBUG_API_BASE_URL }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Bundle release AAB
        working-directory: android
        env:
          CHARITAS_API_BASE_URL: ${{ vars.CHARITAS_API_BASE_URL }}
          CHARITAS_DEBUG_API_BASE_URL: ${{ vars.CHARITAS_DEBUG_API_BASE_URL }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Prepare release assets
        run: |
          set -eux
          mkdir -p release-assets
          REL_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          DBG_APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$REL_APK" release-assets/charitas-ebimpe.apk
          cp "$DBG_APK" release-assets/charitas-ebimpe-debug.apk
          VC=$(grep -E 'versionCode\s*=' android/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          VN=$(grep -E 'versionName\s*=' android/app/build.gradle.kts | head -1 | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "Prepared release APK ($VN / $VC)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: charitas-ebimpe-apks
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: charitas-ebimpe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub Release (latest APK)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ github.run_number }}
          name: Charitas Android ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: |
            ## Charitas — Église Saint Louis Roi d'Ebimpé

            - **versionName** : `${{ env.VERSION_NAME }}`
            - **versionCode** : `${{ env.VERSION_CODE }}`
            - **APK Release** : `charitas-ebimpe.apk`

            ### Installation
            1. Téléchargez `charitas-ebimpe.apk`
            2. Autorisez l'installation depuis des sources inconnues si demandé
            3. Ouvrez le fichier pour installer / mettre à jour

            Lien stable (dernière release) :
            https://github.com/mafiruss12/Charitas-/releases/latest/download/charitas-ebimpe.apk
          files: |
            release-assets/charitas-ebimpe.apk
            release-assets/charitas-ebimpe-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
