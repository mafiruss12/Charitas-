name: Android CI Build APK AAB and Unit Tests

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Bundle release AAB
        run: gradle bundleRelease --stacktrace
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: charitas-ebimpe-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: charitas-ebimpe-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
